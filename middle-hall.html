<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>中厅 - 小塘社区村史馆</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <header class="header" role="banner">
    <div class="header-content">
      <div class="header-title">小塘社区村史馆</div>
    </div>
    <nav class="breadcrumb" aria-label="面包屑导航"></nav>
  </header>

  <main id="main-content" class="main-content" role="main">
    <div class="container">
      <h1 class="page-title">中厅</h1>

      <div class="entry-grid">
        <div class="entry-card" onclick="window.location.href='middle-hall-preface.html'" role="link" tabindex="0">
          <div class="entry-card-icon">📜</div>
          <div class="entry-card-title">序言</div>
          <div class="entry-card-desc">开篇序章</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-ch1.html'" role="link" tabindex="0">
          <div class="entry-card-icon">📖</div>
          <div class="entry-card-title">第一章</div>
          <div class="entry-card-desc">宗族源流 德流芳远</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-ch2.html'" role="link" tabindex="0">
          <div class="entry-card-icon">🏞️</div>
          <div class="entry-card-title">第二章</div>
          <div class="entry-card-desc">祖泽绵垂 兴邦振族</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-main-wall.html'" role="link" tabindex="0">
          <div class="entry-card-icon">🖼️</div>
          <div class="entry-card-title">主形象墙</div>
          <div class="entry-card-desc">小塘的墟撼未来</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-ch3.html'" role="link" tabindex="0">
          <div class="entry-card-icon">📈</div>
          <div class="entry-card-title">第三章</div>
          <div class="entry-card-desc">励精图治 继往开来</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-ch4.html'" role="link" tabindex="0">
          <div class="entry-card-icon">🚀</div>
          <div class="entry-card-title">第四章</div>
          <div class="entry-card-desc">踔厉奋发 赓续前行</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-famous-people.html'" role="link" tabindex="0">
          <div class="entry-card-icon">👥</div>
          <div class="entry-card-title">家园新貌</div>
          <div class="entry-card-desc">民生画卷·小塘村知名人物</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-leaders.html'" role="link" tabindex="0">
          <div class="entry-card-icon">🎓</div>
          <div class="entry-card-title">历任领导</div>
          <div class="entry-card-desc">历任领导·进士文化的精神图谱</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-references.html'" role="link" tabindex="0">
          <div class="entry-card-icon">📚</div>
          <div class="entry-card-title">村史资料</div>
          <div class="entry-card-desc">重要村史资料、书籍</div>
        </div>

        <div class="entry-card" onclick="window.location.href='middle-hall-conclusion.html'" role="link" tabindex="0">
          <div class="entry-card-icon">🔚</div>
          <div class="entry-card-title">结语</div>
          <div class="entry-card-desc">结束语</div>
        </div>
      </div>

      <div class="btn-group">
        <a href="index.html" class="btn btn-secondary">返回游览总导图</a>
      </div>
    </div>
  </main>

  <nav class="footer-nav" role="navigation" aria-label="底部导航">
    <div class="footer-nav-content">
      <div class="footer-nav-dropdown">
        <button class="footer-nav-item footer-nav-toggle" id="villageDropdownBtn" aria-haspopup="true" aria-expanded="false">
          <span class="footer-nav-icon">🏛️</span>
          <span>村史馆</span>
        </button>
        <div class="footer-dropdown-menu" id="villageDropdownMenu" role="menu">
          <a href="index.html" class="footer-dropdown-item" role="menuitem">游览总导图</a>
          <a href="ting-entrance.html" class="footer-dropdown-item" role="menuitem">入口</a>
          <a href="front-hall.html" class="footer-dropdown-item" role="menuitem">前厅</a>
          <a href="middle-hall.html" class="footer-dropdown-item active" role="menuitem" aria-current="page">中厅</a>
          <a href="back-hall.html" class="footer-dropdown-item" role="menuitem">后厅</a>
        </div>
      </div>
      <a href="map.html" class="footer-nav-item">
        <span class="footer-nav-icon">🗺️</span>
        <span>地图</span>
      </a>
      <a href="library.html" class="footer-nav-item">
        <span class="footer-nav-icon">📚</span>
        <span>读书驿站</span>
      </a>
    </div>
  </nav>

  <script src="js/script.js" defer></script>
</body>
</html>
